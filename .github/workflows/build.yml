name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Direct (archive:false) uploads name the artifact after the file, so the
      # release job can download each zip by its exact, deterministic name.
      release_name: ${{ steps.artifacts.outputs.release_name }}
      debug_name: ${{ steps.artifacts.outputs.debug_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            native-certgen/target
          key: rust-${{ runner.os }}-${{ hashFiles('native-certgen/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}
            ccache-${{ runner.os }}-
            ccache-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew zipRelease zipDebug -Porg.gradle.parallel=true -Porg.gradle.vfs.watch=true -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Read version
        id: ver
        run: |
          ver=$(grep 'val verName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          count=$(git rev-list HEAD --count)
          echo "version=${ver}-${count}" >> "$GITHUB_OUTPUT"

      - name: List build artifacts
        id: artifacts
        run: |
          release="$(ls out/*Release*.zip | head -1)"
          debug="$(ls out/*Debug*.zip | head -1)"
          if [[ -n "${release}" && -n "${debug}" ]];
          then
            echo "Release: ${release} ($(du -h "${release}" | cut -f1))"
            echo "Debug: ${debug} ($(du -h "${debug}" | cut -f1))"
            echo "release=${release}" >> "${GITHUB_OUTPUT}"
            echo "debug=${debug}" >> "${GITHUB_OUTPUT}"
            # The direct (archive:false) uploads below are named after these
            # basenames; export them so the release job can download by name.
            echo "release_name=$(basename "${release}")" >> "${GITHUB_OUTPUT}"
            echo "debug_name=$(basename "${debug}")" >> "${GITHUB_OUTPUT}"
          else
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifacts.outputs.release }}
          retention-days: 30
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifacts.outputs.debug }}
          retention-days: 7
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: release-mappings
          path: app/build/outputs/mapping/release
          retention-days: 30
          compression-level: 9

  release:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          ver=$(grep 'val verName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          count=$(git rev-list HEAD --count)
          echo "version=${ver}-${count}" >> "$GITHUB_OUTPUT"

      # The zips are direct (archive:false) uploads whose artifact names equal
      # the file basenames, which the build job exports as outputs. Download
      # each by that exact name. Their blob URLs still end in .zip, which makes
      # the default download path EXTRACT the module zip itself;
      # skip-decompress keeps the raw file so it lands in zips/ unchanged.
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.release_name }}
          path: zips
          skip-decompress: true

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.debug_name }}
          path: zips
          skip-decompress: true

      - name: Verify module zips
        run: |
          ls -la zips/
          test -f "zips/${{ needs.build.outputs.release_name }}"
          test -f "zips/${{ needs.build.outputs.debug_name }}"

      - name: Extract changelog
        run: |
          ver="${VER#v}"
          awk "/^## TEESimulator-RS v${ver%%-*}/{flag=1; next} /^## TEESimulator-RS v/{if(flag) exit} flag" module/changelog.md > /tmp/notes.md
          cat /tmp/notes.md
        env:
          VER: ${{ steps.ver.outputs.version }}

      - name: Create release
        run: |
          gh release delete "$VER" --yes 2>/dev/null || true
          gh release create "$VER" \
            --title "$VER" \
            --latest \
            --notes-file /tmp/notes.md \
            "zips/${{ needs.build.outputs.release_name }}" \
            "zips/${{ needs.build.outputs.debug_name }}"
        env:
          VER: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump update.json
        run: |
          COUNT=$(git rev-list HEAD --count)
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${VER}/${{ needs.build.outputs.release_name }}"
          jq ".versionCode = $COUNT | .zipUrl = \"$ZIP_URL\"" module/update.json > /tmp/update.json
          mv /tmp/update.json module/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/update.json
          git diff --cached --quiet || {
            git commit -m "chore(release): bump update.json to $VER [skip ci]"
            git push origin HEAD:main
          }
        env:
          VER: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
